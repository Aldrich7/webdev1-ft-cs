<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your personalized ramen bill and checkout.">
  <title>Order Summary | MyRamen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cart-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .add-more-btn {
      background: white;
      color: var(--maroon);
      border: 2px solid var(--maroon);
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .add-more-btn:hover {
      background: var(--maroon);
      color: white;
    }

    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cart-item-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .cart-item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f0e8dc;
      padding-bottom: 8px;
    }

    .cart-item-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--maroon);
    }

    .cart-item-details {
      font-size: 0.85rem;
      color: #665;
      line-height: 1.4;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: #b91c1c;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .remove-btn:hover {
      text-decoration: underline;
    }

    .empty-cart-state {
      text-align: center;
      padding: 40px 20px;
      background: white;
      border-radius: 10px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

  <div class="kiosk-container">
    <header class="top-nav">
      <span class="nav-logo serif">MYRAMEN</span>
      <div class="nav-icons">
        <a href="home.html" title="Back to Menu"><i class="fa-solid fa-house"></i></a>
      </div>
    </header>

    <div class="summary-layout">
      <!-- Left Details Panel: Multi-Item List -->
      <div class="summary-left">
        <div class="cart-header-actions">
          <h2 class="serif" style="color: var(--maroon); font-size: 1.6rem;">YOUR RAMEN BOWLS</h2>
          <a href="home.html" class="add-more-btn serif"><i class="fa-solid fa-plus"></i> Add Another Ramen</a>
        </div>

        <div class="cart-items-list" id="cartItemsList">
          <!-- Populated dynamically via summary.js -->
        </div>

        <!-- Global Table Add-ons -->
        <h3 class="serif" style="color: var(--maroon); margin-top: 14px; font-size: 1.15rem;">Side Add-ons</h3>
        <div class="addon-chips">
          <div class="addon-chip" id="addonTofu" onclick="toggleAddon('Fried Tofu', 20)">
            <i class="fa-solid fa-cubes-stacked" style="color: var(--maroon);"></i>
            <div>
              <strong>Fried Tofu</strong>
              <p style="font-size: 0.8rem; color: #666;">&#8369;20</p>
            </div>
          </div>
          <div class="addon-chip" id="addonMushroom" onclick="toggleAddon('Mushroom', 20)">
            <i class="fa-solid fa-leaf" style="color: var(--maroon);"></i>
            <div>
              <strong>Mushroom</strong>
              <p style="font-size: 0.8rem; color: #666;">&#8369;20</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Bill Totals & Submit -->
      <div class="summary-right">
        <div>
          <h2 class="serif" style="font-size: 1.6rem; margin-bottom: 20px;">ORDER SUMMARY</h2>
          <div class="summary-bill-details">
            <div style="display: flex; justify-content: space-between;">
              <span>Total Bowls (<span id="totalBowlsCount">0</span>):</span>
              <span>&#8369;<span id="billBowls">0</span></span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span>Add-ons:</span>
              <span>&#8369;<span id="billAddons">0</span></span>
            </div>
            <div class="total-bill" style="display: flex; justify-content: space-between;">
              <span>TOTAL BILL:</span>
              <span>&#8369;<span id="billTotal">0</span></span>
            </div>
          </div>
        </div>

        <button class="order-it-btn serif" id="orderSubmitBtn" onclick="checkoutOrder()">ORDER IT!</button>
      </div>
    </div>
  </div>

  <script src="js/summary.js"></script>
  <script src="js/transitions.js"></script>
</body>
</html>
