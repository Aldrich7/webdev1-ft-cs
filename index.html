<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyRamen Tabletop Kiosk - Start your personalized ramen experience.">
  <title>Welcome to MyRamen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="welcome-container">
    <div class="welcome-body">
      
      <!-- Left Branding -->
      <div class="welcome-left">
        <div class="welcome-badge serif">
          <i class="fa-solid fa-fire"></i> Authentic Craftsmanship
        </div>
        <h1 class="serif">MYRAMEN</h1>
        <p class="serif">Personalize Your Ramen!</p>
      </div>

      <!-- Right Presentation Stage with Bamboo Mat and Ramen Image -->
      <div class="welcome-right">
        <div class="welcome-table-setting">
          
          <div class="welcome-bamboo-mat"></div>

          <div class="steam-container">
            <div class="steam-wisp"></div>
            <div class="steam-wisp"></div>
            <div class="steam-wisp"></div>
          </div>

          <div class="welcome-bowl">
            <img 
              src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=800&q=80" 
              alt="Authentic Japanese Ramen Bowl"
              class="welcome-bowl-img"
              onerror="this.src='https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=800&q=80'"
            >
          </div>

        </div>
      </div>

    </div>

    <!-- Bottom "Start Order" Navigation -->
    <a href="home.html" class="welcome-bottom-bar" title="Begin your order">
      <span class="start-order-text serif">Start Order</span>
      <i class="fa-solid fa-arrow-right start-order-arrow"></i>
    </a>
  </div>

  <script src="js/transitions.js"></script>
</body>
</html>
