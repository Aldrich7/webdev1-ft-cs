<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyRamen Tabletop Kiosk - Start your personalized ramen experience.">
  <title>Welcome to MyRamen</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .welcome-body {
      min-height: calc(100vh - 135px);
    }

    .welcome-bottom-bar {
      height: 135px;
      min-height: 135px;
      gap: 22px;
      border-top: 5px solid var(--maroon);
      padding: 0 24px;
    }

    .start-order-text {
      font-size: clamp(2.6rem, 6vw, 3.8rem);
      font-weight: 900;
      border-bottom: 5px solid var(--maroon);
      padding-bottom: 4px;
      letter-spacing: 2px;
    }

    .start-order-arrow {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="welcome-body">
      
      <div class="welcome-left">
        <h1 class="serif">MYRAMEN</h1>
        <p class="serif">Personalize Your Ramen!</p>
      </div>

      <div class="welcome-right">
        <div class="welcome-table-setting">
          
          <div class="welcome-bamboo-mat"></div>

          <div class="steam-container">
            <div class="steam-wisp"></div>
            <div class="steam-wisp"></div>
            <div class="steam-wisp"></div>
          </div>

          <div class="welcome-bowl">
            <img 
              src="img/RAMEN BOWL.png" 
              alt="Authentic Japanese Ramen Bowl"
              class="welcome-bowl-img"
            >
          </div>

        </div>
      </div>

    </div>

    <a href="home.html" class="welcome-bottom-bar" title="Begin your order">
      <span class="start-order-text serif">Start Order</span>
      <i class="fa-solid fa-arrow-right start-order-arrow"></i>
    </a>
  </div>

  <script src="js/transitions.js"></script>
</body>
</html>
